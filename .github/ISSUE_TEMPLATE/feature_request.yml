name: Feature request
description: An idea for something Sophia could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The task or problem, in your own words ("I want to say ... and have Sophia ...").
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: dropdown
    id: risk
    attributes:
      label: Does it change things on the computer?
      options: [No, it only reads or answers, Yes (files, apps, settings or the screen), Not sure]
