[project]
name = "sophia"
version = "0.1.0"
description = "A personal AI assistant for Windows: chat, voice, and computer control."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "python-dotenv",
    "pywin32",
    "PySide6",
    "faster-whisper",
    "sounddevice",
    "numpy",
    "Pillow",
    "keyring",
    "Send2Trash",
]

[tool.ruff]
line-length = 100
target-version = "py312"
