[project]
name = "sophia"
version = "0.2.0"
description = "A personal AI assistant for Windows and macOS: chat, voice, and computer control."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "python-dotenv",
    "pywin32; sys_platform == 'win32'",
    "uiautomation; sys_platform == 'win32'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "PySide6",
    "faster-whisper",
    "sounddevice",
    "numpy",
    "Pillow",
    "keyring",
    "Send2Trash",
    "ddgs",
    "trafilatura",
    "requests",
    "psutil",
    "pypdf",
    "pyautogui",
    "mcp",
    "edge-tts",
    "openwakeword",
    "piper-tts",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# pytest fixtures imported from another test module look like redefinitions
"tests/*" = ["F811"]
